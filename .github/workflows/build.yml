name: Build Keebart Vial UF2
# Based on Keebart's CI inspected at this historical revision:
# https://github.com/Keebart/vial-qmk-keebart/blob/63e2d6248209f1926e60daa5b950c771cf09d837/.github/workflows/ci.yml
# External userspace needs a second checkout, CLI paths, and artifact uploads.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-revision:
    name: Resolve current Keebart vial branch revision
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout current Keebart vial branch
        uses: actions/checkout@v4
        with:
          repository: Keebart/vial-qmk-keebart
          ref: vial
          persist-credentials: false

      - name: Resolve shared firmware commit for this run
        id: revision
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.variant }}
    needs: firmware-revision
    runs-on: ubuntu-latest
    # Same immutable build image as the inspected Keebart vial CI.
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: manufacturer
            overlay: stock-userspace
            keymap: vial
            artifact: corne-mx-pro-keebart-vial-stock
          - variant: personal
            overlay: userspace
            keymap: basch_de
            artifact: corne-mx-pro-basch-de-vial
    env:
      QMK_USERSPACE: ${{ github.workspace }}/${{ matrix.overlay }}
      BUILD_KEYMAP: ${{ matrix.keymap }}
      BUILD_INFO: ${{ github.workspace }}/userspace/build-info
    steps:
      - name: Checkout external userspace
        uses: actions/checkout@v4
        with:
          path: userspace
          persist-credentials: false

      - name: Checkout shared Keebart vial revision for this run
        uses: actions/checkout@v4
        with:
          repository: Keebart/vial-qmk-keebart
          # Both variants use the same current branch commit resolved above.
          ref: ${{ needs.firmware-revision.outputs.commit }}
          path: firmware
          submodules: recursive
          persist-credentials: false

      - name: Prepare independent manufacturer userspace
        if: matrix.variant == 'manufacturer'
        run: |
          mkdir -p "$QMK_USERSPACE"
          cp "$GITHUB_WORKSPACE/userspace/qmk.json" "$QMK_USERSPACE/qmk.json"

      - name: Configure external userspace
        working-directory: firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/firmware"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/userspace"
          qmk config user.qmk_home="$GITHUB_WORKSPACE/firmware"
          qmk config user.overlay_dir="$QMK_USERSPACE"

      - name: Record build provenance
        working-directory: firmware
        run: |
          mkdir -p "$BUILD_INFO"
          git rev-parse HEAD > "$BUILD_INFO/firmware-commit.txt"
          git submodule status --recursive > "$BUILD_INFO/submodules.txt"
          git -C "$GITHUB_WORKSPACE/userspace" rev-parse HEAD > "$BUILD_INFO/userspace-commit.txt"
          arm-none-eabi-gcc --version > "$BUILD_INFO/compiler.txt"
          pip freeze > "$BUILD_INFO/python-packages.txt"

      - name: Validate external userspace
        working-directory: firmware
        run: qmk userspace-doctor

      - name: Validate personal keymap and host regression tests
        if: matrix.variant == 'personal'
        working-directory: firmware
        run: |
          python3 "$QMK_USERSPACE/scripts/check_sources.py" .
          python3 "$QMK_USERSPACE/tests/run.py" .

      - name: Compile and verify UF2
        working-directory: firmware
        shell: bash
        run: |
          set -o pipefail
          qmk mass-compile -j "$(nproc)" "keebart/corne_mx_pro/standard:${BUILD_KEYMAP}" \
            2>&1 | tee "$BUILD_INFO/build.log"
          if ! compgen -G "$QMK_USERSPACE/*_${BUILD_KEYMAP}.uf2" > /dev/null; then
            echo "::error::Build produced no UF2 in the external userspace. Inspect build.log."
            exit 1
          fi
          sha256sum "$QMK_USERSPACE/"*"_${BUILD_KEYMAP}.uf2" > "$BUILD_INFO/uf2-sha256.txt"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ github.workspace }}/${{ matrix.overlay }}/*_${{ matrix.keymap }}.uf2
          if-no-files-found: error

      - name: Collect failure logs
        if: failure()
        working-directory: firmware
        run: |
          for log in .build/failed.log.*; do
            [ -f "$log" ] || continue
            cp "$log" "$BUILD_INFO/"
            cat "$log"
          done

      - name: Upload build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance-${{ matrix.variant }}
          path: userspace/build-info/
          if-no-files-found: warn
